[project]
name = "expresslrs-docs"
version = "0.1.0"
description = "ExpressLRS documentation site"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "zensical==0.0.67",
]

[dependency-groups]
spellcheck = [
    "pyspelling==2.12.1",
]

# Installs the project editable so overrides/hooks is on sys.path, which is
# how zensical.toml finds the git_info Markdown extension
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build]
dev-mode-dirs = ["overrides/hooks"]
