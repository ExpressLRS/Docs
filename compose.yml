services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    dns_search: ''
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}  # git_info committer lookups, set in .env
    networks:
      - net
    ports:
      - "8000:8000"
    volumes:
      - ./:/docs:cached

networks:
  net:
    driver: bridge
