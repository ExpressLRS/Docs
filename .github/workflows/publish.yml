name: publish
on:
  push:
    branches:
      - master
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Generate product catalog and homepage news
        run: |
          uv run python overrides/hooks/product_catalog.py
          uv run python overrides/hooks/blog_posts.py

      - name: Build site
        run: uv run zensical build --clean

      - name: Generate llms.txt and redirect stubs
        run: |
          uv run python overrides/hooks/llms_txt.py
          uv run python overrides/hooks/redirects.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
