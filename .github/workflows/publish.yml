name: publish
on:
  push:
    branches:
      - master
  # Rebuild daily so the product catalog picks up targets.json changes
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # git_info needs full history for page dates

      - uses: actions/configure-pages@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Generate product catalog and homepage news
        run: |
          uv run python overrides/hooks/product_catalog.py
          uv run python overrides/hooks/blog_posts.py

      - name: Build site
        run: uv run zensical build --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # git_info committer lookups

      - name: Generate llms.txt
        run: uv run python overrides/hooks/llms_txt.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
