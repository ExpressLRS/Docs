[project]
site_name = "ExpressLRS"
site_url = "https://www.expresslrs.org/"
site_author = "ExpressLRS"
site_description = """
ExpressLRS is a fully open radio control link built for maximum range, \
speed, and data throughput. Wide hardware support across both 900 MHz \
and 2.4 GHz frequencies.\
"""
copyright = "Copyright &copy; 2018–2026 ExpressLRS LLC"

# Repository — used by content.action.edit / content.action.view
repo_name = "ExpressLRS/ExpressLRS"
repo_url  = "https://github.com/ExpressLRS/ExpressLRS/releases/"
edit_uri  = "https://github.com/ExpressLRS/Docs/edit/master/docs/"

strict = true

extra_css = [
    "assets/stylesheets/main.css",
    "assets/stylesheets/colors.css",
    "assets/stylesheets/home.css",
    "assets/stylesheets/product-finder.css",
]

extra_javascript = [
    "assets/javascripts/binding-phrase.js",
    "https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/tablesort.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/tablesort/5.2.1/sorts/tablesort.number.min.js",
    "assets/javascripts/tablesort.js",
    "assets/javascripts/mathjax.js",
    "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

