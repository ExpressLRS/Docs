# ---------------------------------------------------------------------------
# Markdown extensions — ported from mkdocs.yml; replaces Zensical's defaults
# ---------------------------------------------------------------------------
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem.smart_enable = "all"
pymdownx.caret = {}
pymdownx.critic = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink.repo_url_shorthand = true
pymdownx.magiclink.user = "ExpressLRS"
pymdownx.magiclink.repo = "ExpressLRS"
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
# Slugged tab ids keep links like firmware-version.md#via-lua-script working
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
[project.plugins.blog]
blog_toc = true
post_date_format = "long"
post_url_date_format = "yyyy/MM/dd"

[project.plugins.tags]

[project.plugins.rss]
match_path = "blog/posts/.*"
categories = ["categories"]

# CI checks out shallow, so git dates would all be the latest commit
[project.plugins.rss.date_from_meta]
as_creation = "date"
as_update = "date"

[project.plugins.rss.feeds_filenames]
rss_created = "feed.xml"
json_created = "feed.json"
rss_updated = "feed-updated.xml"
json_updated = "feed-updated.json"

[project.plugins.social.cards_layout_options]
background_color = "#5f8bf3"
color = "#FFFFFF"

[project.plugins.minify]
minify_html = true

[project.plugins.redirects.redirect_maps]
