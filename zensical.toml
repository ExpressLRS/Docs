# ---------------------------------------------------------------------------
# TODO — blocked on upstream Zensical support:
#
#   * git-revision-date-localized + git-committers (page footer dates and
#     contributor avatars)
#
# Handled outside Zensical until its module system ships — the mkdocs
# hooks in overrides/hooks/ also run as standalone scripts, wired into
# .github/workflows/publish.yml and `make site`:
#   * product_catalog.py  (before build)  → docs/assets/data/products.json
#   * blog_posts.py       (before build)  → overrides/partials/
#     recent-posts.html, included by home.html for the Latest News section
#   * llms_txt.py         (after build)   → site/llms.txt, built from the nav
#     and page descriptions (the native llmstxt plugin can't read either)
# ---------------------------------------------------------------------------
