# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
[project.theme]
# "classic" matches the Material for MkDocs look the site has always had;
# Zensical's default "modern" variant restyles the header/nav.
variant    = "classic"
custom_dir = "overrides"
language   = "en"
favicon    = "assets/favicon.png"
logo       = "assets/images/logotype.svg"

features = [
    "announce.dismiss",
    "navigation.sections",
    "navigation.tabs",
    "navigation.footer",
    "navigation.tracking",
    "navigation.path",
    "search.highlight",
    "search.suggest",
    "toc.follow",
    "content.action.edit",
    "content.action.view",
]

[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

# Dark mode (default — matches the historical ExpressLRS palette)
[[project.theme.palette]]
media   = "(prefers-color-scheme: dark)"
scheme  = "slate"
primary = "expresslrs-dark"
accent  = "expresslrs-dark"
toggle.icon = "material/weather-night"
toggle.name = "Switch to light mode"

# Light mode
[[project.theme.palette]]
media   = "(prefers-color-scheme: light)"
scheme  = "default"
primary = "expresslrs"
accent  = "expresslrs"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode"

# ---------------------------------------------------------------------------
# Extra
# ---------------------------------------------------------------------------
[project.extra.analytics]
provider = "google"
property = "G-VMF2B5BYJZ"

[project.extra.analytics.feedback]
title = "Was this page helpful?"

